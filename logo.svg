  <!-- duck fills -->
  <path d="M26 360 Q20 318 50 304 Q70 360 128 352 L262 352 Q318 360 318 412 Q318 474 240 476 L120 476 Q30 472 26 360 Z" fill="#FFD21F"/>
  <path d="M100 404 Q140 380 196 404 Q170 448 124 440 Q102 432 100 404 Z" fill="#F2B100" stroke="#160B33" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="176" cy="262" r="82" fill="#FFD21F"/>
  <path d="M244 244 Q300 236 322 262 Q302 296 244 288 Z" fill="#FF7A1A"/>
  <path d="M248 266 Q286 270 320 262" fill="none" stroke="#160B33" stroke-width="7" stroke-linecap="round"/>
  <circle cx="204" cy="238" r="20" fill="#160B33"/>
  <circle cx="211" cy="231" r="7" fill="#FFFFFF"/>
