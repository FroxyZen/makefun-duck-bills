<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- make.fun Duck Bills ($BILLS): the debugging duck whose bill finally holds a bill -->
  <rect width="512" height="512" fill="#5B2EFF"/>
  <path d="M0 462 Q64 440 128 462 T256 462 T384 462 T512 462 V512 H0 Z" fill="#3A14C9"/>

  <!-- header: make.fun -->
  <text x="256" y="92" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="82"
        fill="#FFFFFF" stroke="#160B33" stroke-width="14" stroke-linejoin="round" paint-order="stroke">make.fun</text>

  <!-- the cheque, held in the bill -->
  <g transform="rotate(7 392 268)">
    <path d="M286 128 H498 V392 L480 376 L462 392 L444 376 L426 392 L408 376 L390 392 L372 376 L354 392 L336 376 L318 392 L300 376 L286 390 Z"
