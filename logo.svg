    <text x="392" y="212" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="#E8173A">PAID</text>
    <text x="404" y="302" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#160B33">150</text>
    <text x="392" y="356" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#2775CA">USDC</text>
  </g>

  <!-- duck outline -->
